# One file (worker.js) deployed once per city. City differences live in the
# dashboard Variables (CITY_*, GHL tokens, keys) and each city's own D1 — never here.
#
# Every value below was copied from the live Workers on 2026-09-25.
# `npm run check-live` compares this file with what is live; the deploy script
# refuses to run while anything here disagrees.

main = "worker.js"
keep_vars = true            # never touch the dashboard Variables; Secrets are never touched by deploy
no_bundle = true            # upload worker.js exactly as committed, so live code can be diffed against git
find_additional_modules = false  # only upload worker.js, never anything from node_modules

[env.orlando]
name = "goes-local-orlando-api"
compatibility_date = "2026-09-10"
workers_dev = true
preview_urls = false
routes = [{ pattern = "orlandogoeslocal.com", custom_domain = true }]
triggers = { crons = ["*/5 * * * *"] }
placement = { mode = "smart" }   # D1 lives in APAC (Singapore); run the Worker next to it

[env.orlando.observability]
enabled = true
head_sampling_rate = 1
logs = { enabled = true, head_sampling_rate = 1, persist = true, invocation_logs = true }
traces = { enabled = false, persist = true, head_sampling_rate = 1 }

[[env.orlando.d1_databases]]
binding = "orlando-directory-db"
database_name = "orlando-directory-db"
database_id = "25894099-96cd-4431-8930-f21badead15b"

[[env.orlando.kv_namespaces]]
binding = "SESSIONS"
id = "99679f634f624df0b542c1e2b21a2480"   # GOES_LOCAL_ORLANDO_SESSIONS

[env.miami]
name = "goes-local-miami-api"
compatibility_date = "2026-08-06"
workers_dev = true
preview_urls = false
routes = [{ pattern = "miamigoeslocal.com", custom_domain = true }]
triggers = { crons = ["*/5 * * * *"] }
placement = { mode = "smart" }   # D1 lives in APAC (Singapore); run the Worker next to it

[env.miami.observability]
enabled = true
head_sampling_rate = 1
logs = { enabled = true, head_sampling_rate = 1, persist = true, invocation_logs = true }
traces = { enabled = false, persist = true, head_sampling_rate = 1 }

[[env.miami.d1_databases]]
binding = "miami-directory-db"
database_name = "miami-directory-db"
database_id = "b0226c38-0b16-45d9-84bf-603435efa245"

[[env.miami.kv_namespaces]]
binding = "SESSIONS"
id = "4355959c05424505953f2ccf725eee4c"   # GOES_LOCAL_SESSIONS
